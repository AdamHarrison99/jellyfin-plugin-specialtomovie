version: "1.0.17.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Detects TV specials that are also movies, creates hard links, and syncs watch status."
description: |
  Automatically detects Season 0 episodes that are also standalone movies (e.g., El Camino,
  Downton Abbey: A New Era), creates hard links in your movie library, and bidirectionally
  syncs watch status between the episode and movie entries. Supports TMDB and TVDB lookups,
  dry run mode, configurable library mappings, and automatic cleanup.
category: "General"
owner: "AdamHarrison99"
artifacts:
  - "Jellyfin.Plugin.SpecialToMovie.dll"
changelog: |
  - Re-pin Jellyfin.Controller/Jellyfin.Model from 12.0.0-rc4 to the released 12.0.0
  - Cross-link buttons on the detail page to jump between a linked special and its movie
  - Ignore list entries can name a whole series
  - Pair removal prompts differently depending on whether media files are affected
  - Scheduled task names prefixed with the plugin name
  - Pair store survives an unwritable or unreadable data file instead of throwing
  - Escape provider IDs used in TMDB/TVDB request paths
  - Faster full scan: index episodes for force links, cache the per-library movie filter
