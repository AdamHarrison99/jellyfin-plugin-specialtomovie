changelog: |
  - Cross-link badge joins the row of brand logos even when a plugin renders those
    logos into a container of its own, which left one side of a pair as plain text
  - Cross-link badge takes its size and alignment from a neighbouring logo instead
    of a fixed 28px box, so it lines up with the rest of the row
  - Detail pages do markedly less style and layout work on every render
