changelog: |
  - Cross-link icon measures its place in the row again whenever the row moves
    under it, so it stays in line after navigation, a window resize, or a
    stylesheet that loads late
  - Cross-link icon lines up with the nearest link the row actually shows, and
    only when that link is on the same line
  - Cross-link captions renamed to "Linked Movie" and "Linked Special"
  - Config page: the Linked Pairs filter dropdowns keep their arrows, which had
    escaped to the page's top-right corner
  - Config page: Force Links and Ignore List formats are laid out as column
    legends with a real example, drop the quotes the parser never accepted, and
    say where a Jellyfin item ID comes from
