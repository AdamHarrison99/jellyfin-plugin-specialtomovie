version: "2.1.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Detects TV specials that are also movies, creates hard links, and syncs watch status."
description: |
  Automatically detects Season 0 episodes that are also standalone movies (e.g., El Camino,
  Downton Abbey: A New Era), creates hard links in your movie library, and bidirectionally
  syncs watch status between the episode and movie entries. Supports TMDB and TVDB lookups,
  dry run mode, configurable library mappings, and automatic cleanup.
category: "General"
owner: "AdamHarrison99"
artifacts:
  - "Jellyfin.Plugin.SpecialToMovie.dll"
changelog: |
  - New setting: Minimum special length (default 40 minutes). A special shorter
    than this is not turned into a new movie, which stops featurettes, trailers
    and recaps from being linked. Existing links, force links and specials
    matched to a movie already in the library are not affected. Set to 0 to
    link specials of any length
  - A newly added special is checked once Jellyfin has read its length
  - Fixed a rare case where a special added during a full scan could be paired
    twice
