version: "1.0.18.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Detects TV specials that are also movies, creates hard links, and syncs watch status."
description: |
  Automatically detects Season 0 episodes that are also standalone movies (e.g., El Camino,
  Downton Abbey: A New Era), creates hard links in your movie library, and bidirectionally
  syncs watch status between the episode and movie entries. Supports TMDB and TVDB lookups,
  dry run mode, configurable library mappings, and automatic cleanup.
category: "General"
owner: "AdamHarrison99"
artifacts:
  - "Jellyfin.Plugin.SpecialToMovie.dll"
changelog: |
  - Cross-links render as a badge again on rows that show brand logos
  - Cross-link text picks its colour from the background so it stays readable on any theme
  - Cross-links are always placed last in the external links row
  - Clicking a cross-link no longer opens a new tab on the first click
  - Cross-links no longer depend on jellyfin-web class names, which failed silently
  - Send Cache-Control on the rewritten index.html so a stale copy cannot disable the script
